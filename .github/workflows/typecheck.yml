name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-types:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          brew install bun biome typescript
          bun --version
          biome --version
          tsc --version

      - name: Lint and check TypeScript types
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build and check public declarations without packages
        run: |
          bun run test:types
          test ! -d node_modules
